replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/shultzlab/docker-gcp/dinosaur-api
  pullPolicy: Always
  tag: "1.1.0"

imagePullSecrets:
  - name: gcp-registry
nameOverride: ""
fullnameOverride: ""

env:
  - name: OTEL_SERVICE_NAME
    value: "dinosaur-fact-api"
  - name: OTEL_TRACES_EXPORTER
    value: "otlp"
  - name: OTEL_METRICS_EXPORTER
    value: "otlp"
  - name: NODE_OPTIONS
    value: "--require @opentelemetry/auto-instrumentations-node/register"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "http/protobuf"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "https://otlp-gateway-prod-us-east-0.grafana.net/otlp"
  - name: OTEL_EXPORTER_OTLP_HEADERS
    valueFrom:
      secretKeyRef:
        name: grafana.api.secret
        key: OTEL_EXPORTER_OTLP_HEADERS
        optional: false

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  # className: haproxy        # default, only set to override
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-production
  # tls:
  #   - secretName: dinosaur-facts-api-tls
  #     hosts:
  #       - dinosaur-facts-api.internalshultzlab.com
  hosts:
    - host: dinosaur-facts-api.internalshultzlab.com
      paths:
        - path: /
    - host: dinosaur-facts-api.shultzlab.com
      paths:
        - path: /

livenessProbe:
  enabled: false
readinessProbe:
  enabled: false

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
